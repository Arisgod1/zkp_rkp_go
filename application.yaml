app:
  host: "0.0.0.0"
  port: "8080"

db:
  dsn: "host=postgres user=zkp_user password=zkp_pass dbname=zkp port=5432 sslmode=disable TimeZone=Asia/Shanghai"

redis:
  addr: "redis:6379"

jwt:
  secret: "replace-this-with-env-secret-in-prod"
  expire_seconds: 86400

zkp:
  challenge_ttl_seconds: 300

rate_limit:
  register_per_minute: 30
  challenge_per_minute: 60
  verify_per_minute: 60

kafka:
  enabled: true
  brokers:
    - "kafka:9092"
  topic: "zkp.audit"
  client_id: "zkp-go"
  async_queue_size: 1000
  write_timeout_ms: 3000
app:
  host: "0.0.0.0"
  port: "8080"

db:
  dsn: "host=localhost user=postgres password=postgres dbname=zkp_auth port=5432 sslmode=disable TimeZone=Asia/Shanghai"

redis:
  addr: "localhost:6379"

jwt:
  secret: "replace-this-with-env-secret-in-prod"
  expire_seconds: 86400

zkp:
  challenge_ttl_seconds: 300

rate_limit:
  register_per_minute: 30
  challenge_per_minute: 60
  verify_per_minute: 60

kafka:
  enabled: true
  brokers:
    - "localhost:9092"
  topic: "zkp_audit_events"
  client_id: "zkp_rkp_go"
  async_queue_size: 1000
  write_timeout_ms: 800